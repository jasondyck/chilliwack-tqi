name: Publish dashboard

# Re-runs the analysis against the latest BC Transit GTFS feed and publishes
# the static dashboard to GitHub Pages.
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (early morning Pacific)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run analysis
        run: go run ./cmd/tqi run --no-cache --output-dir output

      - name: Build dashboard
        working-directory: web
        run: |
          cp ../output/tqi_results.json public/results.json
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
